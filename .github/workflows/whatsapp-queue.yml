name: Daily hot launches to WhatsApp
on:
  workflow_dispatch:
    inputs:
      dry_run:
        type: boolean
        default: true
  push:
    branches: [main]
    paths:
      - 'whatsapp-queue.json'
      - 'scripts/whatsapp-queue*.mjs'
      - '.github/workflows/whatsapp-queue.yml'
  schedule:
    - cron: '0,15,30,45 4-16 * * *'
permissions:
  contents: write
concurrency:
  group: whatsapp-daily-queue
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 2
      - name: Determine publishing mode
        id: mode
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          MANUAL_DRY_RUN: ${{ inputs.dry_run }}
        run: |
          if [[ "$EVENT_NAME" == "schedule" ]]; then
            echo "dry=false" >> "$GITHUB_OUTPUT"
          elif [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            echo "dry=${MANUAL_DRY_RUN:-true}" >> "$GITHUB_OUTPUT"
          elif git diff-tree --no-commit-id --name-only -r HEAD | grep -Fxq 'whatsapp-queue.json'; then
            echo "dry=false" >> "$GITHUB_OUTPUT"
          else
            echo "dry=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test scripts/whatsapp-queue.test.mjs
      - run: npm install --no-save @modelcontextprotocol/sdk@^1
      - run: node scripts/whatsapp-queue-runner.mjs
        env:
          API_TOKEN: ${{ secrets.WHAPI_TOKEN }}
          GH_TOKEN: ${{ github.token }}
          DRY_RUN: ${{ steps.mode.outputs.dry }}
