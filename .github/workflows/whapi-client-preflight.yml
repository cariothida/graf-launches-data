name: Whapi client database preflight
on:
  push:
    branches: [main]
    paths: ['.github/workflows/whapi-client-preflight.yml']
permissions:
  contents: read
concurrency:
  group: whatsapp-research-readonly
  cancel-in-progress: false
jobs:
  health:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Read connection status without waking channel
        env:
          WHAPI_TOKEN: ${{ secrets.WHAPI_TOKEN }}
        shell: python
        run: |
          import os, urllib.request, urllib.error, json
          token=os.environ.get('WHAPI_TOKEN')
          if not token:
              print('RESULT TOKEN_MISSING')
              raise SystemExit(1)
          req=urllib.request.Request('https://gate.whapi.cloud/health?wakeup=false',headers={'Authorization':'Bearer '+token,'Accept':'application/json'})
          try:
              with urllib.request.urlopen(req,timeout=30) as response:
                  data=json.load(response)
                  print('RESULT HTTP_STATUS',response.status)
              status=data.get('status')
              if isinstance(status,dict):
                  for field in ['code','text']:
                      value=status.get(field)
                      if field=='code' and isinstance(value,int):
                          print('RESULT STATUS_CODE',value)
                      elif field=='text' and value in ['AUTH','INIT','LAUNCH','QR','STOP','ERROR','READY','DISCONNECTED','CONNECTED']:
                          print('RESULT STATUS_TEXT',value)
              elif isinstance(status,str) and status in ['AUTH','INIT','LAUNCH','QR','STOP','ERROR','READY','DISCONNECTED','CONNECTED']:
                  print('RESULT STATUS_TEXT',status)
              print('RESULT BODY_WITHHELD_NO_PERSONAL_DATA_LOGGED')
          except urllib.error.HTTPError as error:
              print('RESULT HTTP_ERROR',error.code)
              raise SystemExit(1)
          except Exception:
              print('RESULT TRANSPORT_OR_RESPONSE_ERROR')
              raise SystemExit(1)
