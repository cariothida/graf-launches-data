name: Whapi client database preflight
on:
  push:
    branches: [main]
    paths: ['.github/workflows/whapi-client-preflight.yml']
permissions:
  contents: read
concurrency:
  group: whatsapp-research-readonly
  cancel-in-progress: false
jobs:
  history_depth:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Inspect history depth with dates and counts only
        env:
          WHAPI_TOKEN: ${{ secrets.WHAPI_TOKEN }}
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          const pause=ms=>new Promise(r=>setTimeout(r,ms));
          const token=process.env.WHAPI_TOKEN;
          let requests=0,errors=0;
          async function get(path){
           const url=new URL('https://gate.whapi.cloud'+path);
           const allowed=url.pathname==='/health'||url.pathname==='/chats'||url.pathname==='/messages/list'||/^\/messages\/list\/[\d%a-zA-Z.@-]+$/.test(url.pathname);
           if(!allowed||url.origin!=='https://gate.whapi.cloud')throw Error('PATH_NOT_ALLOWED');
           for(let attempt=0;attempt<4;attempt++){
            await pause(3000);requests++;
            let r;
            try{r=await fetch(url,{method:'GET',headers:{Authorization:'Bearer '+token,Accept:'application/json'},redirect:'error',signal:AbortSignal.timeout(30000)});}
            catch{errors++;if(attempt===3)throw Error('TRANSPORT_ERROR');await pause(5000*2**attempt);continue;}
            if(r.ok)return await r.json();
            errors++;
            if([429,500,502,503,504].includes(r.status)&&attempt<3){const wait=Number(r.headers.get('retry-after'));if(wait>60)throw Error('LONG_RETRY_REQUIRED');await pause(Math.max(5000*2**attempt,Number.isFinite(wait)?wait*1000:0));continue;}
            throw Error('HTTP_'+r.status);
           }
          }
          const valid=t=>typeof t==='number'&&t>0&&t<4102444800;
          const iso=t=>valid(t)?new Date(t*1000).toISOString():null;
          const periodStart=Date.parse('2022-10-23T20:00:00Z')/1000;
          const periodEnd=Date.parse('2022-10-29T20:00:00Z')/1000;
          try{
           if(!token)throw Error('TOKEN_MISSING');
           const health=await get('/health?wakeup=false');
           if(health.status?.text!=='AUTH')throw Error('CHANNEL_NOT_AUTH');
           const chats=new Map();let duplicates=0;
           for(let offset=0;;offset+=500){
            const data=await get('/chats?count=500&offset='+offset);
            if(!Array.isArray(data.chats))throw Error('UNEXPECTED_SCHEMA');
            if(!data.chats.length)break;
            let added=0;for(const c of data.chats){if(chats.has(c.id))duplicates++;else added++;chats.set(c.id,c);}
            if(!added)throw Error('PAGINATION_NO_PROGRESS');
           }
           const values=[...chats.values()];
           const personal=values.filter(c=>(c.type==='contact'||/@(s\.whatsapp\.net|lid)$/.test(c.id))&&!['group','newsletter','broadcast','stories','announcement'].includes(c.type));
           const yearCounts={};let oldestChat=null,oldestLast=null;
           for(const c of personal){
            if(valid(c.timestamp))oldestChat=oldestChat===null?c.timestamp:Math.min(oldestChat,c.timestamp);
            const t=c.last_message?.timestamp;
            if(valid(t)){oldestLast=oldestLast===null?t:Math.min(oldestLast,t);const year=new Date(t*1000).getUTCFullYear();yearCounts[year]=(yearCounts[year]||0)+1;}
           }
           const candidates=personal.filter(c=>{const t=c.last_message?.timestamp??c.timestamp;return valid(t)&&t>=periodStart&&t<periodEnd;});
           console.log('RESULT CHAT_SCAN',JSON.stringify({unique:chats.size,duplicates,personal_or_personal_suffix:personal.length,oldest_chat_timestamp:iso(oldestChat),oldest_last_message_timestamp:iso(oldestLast),last_message_year_counts:yearCounts,period_candidates:candidates.length}));
           const oldest=await get('/messages/list?count=1&offset=0&sort=asc&normal_types=false');
           if(!Array.isArray(oldest.messages))throw Error('UNEXPECTED_SCHEMA');
           console.log('RESULT OLDEST_GLOBAL_MESSAGE',JSON.stringify({returned:oldest.messages.length,timestamp:iso(oldest.messages[0]?.timestamp)}));
           const window=await get('/messages/list?count=1&offset=0&sort=asc&normal_types=false&time_from='+periodStart+'&time_to='+(periodEnd-1));
           if(!Array.isArray(window.messages))throw Error('UNEXPECTED_SCHEMA');
           console.log('RESULT PERIOD_MESSAGE_PROBE',JSON.stringify({returned:window.messages.length,timestamp:iso(window.messages[0]?.timestamp)}));
           const targets=candidates.sort((a,b)=>(a.last_message?.timestamp??a.timestamp)-(b.last_message?.timestamp??b.timestamp)).slice(0,3);
           for(let index=0;index<targets.length;index++){
            const target=targets[index];let count=0,earliest=null,latest=null,pages=0;const ids=new Set();
            for(let offset=0;;offset+=500){
             const data=await get('/messages/list/'+encodeURIComponent(target.id)+'?count=500&offset='+offset+'&sort=desc&normal_types=false');
             if(!Array.isArray(data.messages))throw Error('UNEXPECTED_SCHEMA');pages++;
             if(!data.messages.length)break;
             let added=0;
             for(const m of data.messages){
              if(ids.has(m.id))continue;ids.add(m.id);added++;count++;
              if(valid(m.timestamp)){earliest=earliest===null?m.timestamp:Math.min(earliest,m.timestamp);latest=latest===null?m.timestamp:Math.max(latest,m.timestamp);}
             }
             if(!added)throw Error('PAGINATION_NO_PROGRESS');
            }
            console.log('RESULT ANONYMOUS_PERIOD_CHAT',JSON.stringify({probe:index+1,messages:count,pages,earliest:iso(earliest),latest:iso(latest),history_coverage:'NOT_VERIFIED'}));
           }
           console.log('RESULT COMPLETE',JSON.stringify({requests,errors}));
          }catch(e){
           const msg=/^(PATH_NOT_ALLOWED|HTTP_\d{3}|TOKEN_MISSING|CHANNEL_NOT_AUTH|UNEXPECTED_SCHEMA|PAGINATION_NO_PROGRESS|TRANSPORT_ERROR|LONG_RETRY_REQUIRED)$/.test(e.message)?e.message:'RESPONSE_ERROR';
           console.log('RESULT STOP',msg,'REQUESTS',requests,'ERRORS',errors);process.exitCode=1;
          }
          NODE
