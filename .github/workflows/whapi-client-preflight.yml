name: Whapi client database preflight
on:
  push:
    branches: [main]
    paths: ['.github/workflows/whapi-client-preflight.yml']
permissions:
  contents: read
concurrency:
  group: whatsapp-research-readonly
  cancel-in-progress: false
jobs:
  health:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: One read-only health request using built-in Node fetch
        env:
          WHAPI_TOKEN: ${{ secrets.WHAPI_TOKEN }}
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          try {
            const token=process.env.WHAPI_TOKEN;
            if(!token){console.log('RESULT TOKEN_MISSING');process.exit(1);}
            const response=await fetch('https://gate.whapi.cloud/health?wakeup=false',{method:'GET',headers:{Authorization:'Bearer '+token,Accept:'application/json'},redirect:'error',signal:AbortSignal.timeout(30000)});
            console.log('RESULT HTTP_STATUS',response.status);
            if(!response.ok){process.exit(1);}
            const body=await response.json();
            const status=body.status;
            if(Number.isInteger(status?.code))console.log('RESULT STATUS_CODE',status.code);
            if(['AUTH','QR','INIT','LAUNCH','STOP','SYNC_ERROR','ERROR'].includes(status?.text))console.log('RESULT STATUS_TEXT',status.text);
            console.log('RESULT NO_PERSONAL_DATA_LOGGED');
          }catch{console.log('RESULT TRANSPORT_OR_RESPONSE_ERROR');process.exitCode=1;}
          NODE
